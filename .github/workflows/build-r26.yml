name: Build R26 commandset
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Revit 2026 command set
        run: dotnet build commandset/RevitMCPCommandSet.csproj -c "Release R26"
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $dir = Get-ChildItem commandset/bin -Recurse -Filter RevitMCPCommandSet.dll | Select-Object -First 1
          Compress-Archive -Path "$($dir.DirectoryName)/*" -DestinationPath out/RevitMCPCommandSet-R26-sendcode-fix.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RevitMCPCommandSet-R26-sendcode-fix
          path: out/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
